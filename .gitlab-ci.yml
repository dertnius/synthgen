# The notary. One stage, one job, no database and no Copilot.
#
# It recomputes what it can from the committed artifacts and cross-checks the rest: the
# plan hash against plan.approved, the rules hash the plan was built from, facts.json
# against a fresh extraction from patches.jsonl, report.md against facts.json, and the
# four-eyes rule (the approver must not be whoever last changed rules/gaps.yaml).
#
# Scope, stated plainly: this proves a set of files produced by one actor is internally
# consistent. It catches drift, a stale report, an unapproved plan and a same-person
# approval. It does not defend against someone editing patches.jsonl and facts.json
# together — see D13 in PFANDWERK-PLAN.md.
#
# Copilot CLI is never installed here (hard rule 6), and Revert is never wired in
# (hard rule 7).

stages: [audit]

notary:
  stage: audit
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    # Full history: the four-eyes check needs `git log` on rules/gaps.yaml.
    GIT_DEPTH: "0"
  rules:
    - exists: [artifacts/plan.approved]
  script:
    - dotnet build src/Pfandwerk -c Release -v q
    - dotnet run --project src/Pfandwerk -c Release --no-build -v q -- notary
  artifacts:
    when: always
    paths: [artifacts/notary.json]
    expire_in: 30 days
