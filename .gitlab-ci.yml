# Build + test, then the notary. The notary needs no database and no Copilot.
#
# The notary recomputes what it can from the committed artifacts and cross-checks the rest:
# the plan hash against plan.approved, the rules hash the plan was built from, facts.json
# against a fresh extraction from patches.jsonl, report.md against facts.json, and the
# four-eyes rule (the approver must not be whoever last changed rules/gaps.yaml).
#
# Scope, stated plainly: this proves a set of files produced by one actor is internally
# consistent. It catches drift, a stale report, an unapproved plan and a same-person
# approval. It does not defend against someone editing patches.jsonl and facts.json
# together — see D13 in PFANDWERK-PLAN.md.
#
# Copilot CLI is never installed here (hard rule 6), and Revert is never wired in
# (hard rule 7).

stages: [build, audit]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # A CI run must not pass by skipping SQLite-backed tests.
  SYNTHGEN_REQUIRE_SQLITE: "1"

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - apt-get update -qq && apt-get install --no-install-recommends -y -qq libsqlite3-0
    - export SYNTHGEN_SQLITE_DLL="$(ldconfig -p | awk '/libsqlite3\.so(\.0)?/{print $NF; exit}')"
    - test -n "$SYNTHGEN_SQLITE_DLL" && test -f "$SYNTHGEN_SQLITE_DLL"
    - dotnet build SynthGen.sln -c Release -v q
    # Missing native SQLite is a failure in CI, not a silent skip — TESTING.md.
    - dotnet test SynthGen.sln -c Release --no-build -v q

notary:
  stage: audit
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    # Full history: the four-eyes check needs `git log` on rules/gaps.yaml.
    GIT_DEPTH: "0"
  rules:
    - exists: [artifacts/plan.approved]
  script:
    - dotnet build src/SynthGen.Cli -c Release -v q
    - dotnet run --project src/SynthGen.Cli -c Release --no-build -v q -- patch notary
  artifacts:
    when: always
    paths: [artifacts/notary.json]
    expire_in: 30 days
