# Reviewed AdventureWorks corruption rules. Values are frozen in plan.json before APPLY.
rules:
  - id: AW-PROD-001
    table: Production.Product
    key: ProductID
    column: Color
    kind: ephemeral
    gap: "Color = 'X9'"
    fix: dataset.product-colors
    invariant: "Color IS NULL OR Color <> 'X9'"
    threshold: 10
    reason: >-
      The sample corruption job uses X9 as an impossible product-color sentinel.
      Consumers group products by the published color vocabulary and reject the sentinel.

  - id: AW-ORDER-001
    table: Sales.SalesOrderHeader
    key: SalesOrderID
    column: Status
    kind: ephemeral
    gap: "Status < 1 OR Status > 5"
    fix: dataset.order-statuses
    invariant: "Status BETWEEN 1 AND 5"
    threshold: 10
    reason: >-
      The sample corruption job writes status zero. The AdventureWorks consumer contract
      accepts only the five statuses generated by this subset.

  - id: CUR-001
    table: Sales.Currency
    key: CurrencyCode
    column: Name
    kind: derived
    gap: "Name IS NULL"
    fix: dataset.currencies
    inputs: [CurrencyCode]
    onMissingInput: block
    threshold: 20
    reason: >-
      A currency without its ISO name cannot be rendered by the invoicing consumer, which
      refuses to print a bare code. The name is not arbitrary: it is the reviewed ISO
      vocabulary in datasets/currencies.yaml, looked up by the row's own code. A code the
      vocabulary does not know (the seeded ZZZ row) is left unpatched and listed at the
      gate — inventing a name for an unknown code is exactly what this pipeline refuses
      to do.

  - id: AW-CUSTOMER-001
    table: Sales.Customer
    key: CustomerID
    column: PersonID
    kind: identity
    gap: "PersonID IS NULL"
    fix: adventureworks.personId
    invariant: "PersonID IS NOT NULL"
    threshold: 500
    reason: >-
      A customer without a person reference cannot be joined by the downstream customer
      consumer. Generated references are permanent ledger identities and must be reused
      after an upstream value is cleared.
